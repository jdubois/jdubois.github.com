<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Two additions. One missing notebook.</title>
  <desc id="desc">Conceptual depiction of the repeated-add bug. Add the ten-euro Notebook, wait for the response, then add it again. The starter incorrectly stores quantity one and ten euros. Expected persisted state is quantity two and twenty euros, including after reload.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e2e6ea"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#1d4ed8" stroke-width="1.5"/></marker>
    <g id="book">
      <path d="M8 8h118v160H8z" fill="#d2d8df"/>
      <path d="M4 3h118v160H4z" fill="#fff" stroke="#d2d8df"/>
      <path d="M0 0h118v158H0z" fill="#1d4ed8"/>
      <path d="M0 0h9v158H0z" fill="#14309c"/>
      <path d="M25 35h66m-66 14h49" stroke="#fff" stroke-width="3"/>
      <path d="M25 120h53" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    </g>
    <style>
      text{font-family:"Schibsted Grotesk",Arial,sans-serif;fill:#0f1419}
      .body{font-family:"Hanken Grotesk",Arial,sans-serif;font-size:21px;fill:#46505f}
      .mono{font-family:"JetBrains Mono",monospace;font-size:16px;fill:#475569}
    </style>
  </defs>
  <path fill="#f4f6f8" d="M0 0h1440v800H0z"/>
  <text x="72" y="95" font-size="46" font-weight="800" letter-spacing="-1.6">Two additions. One missing notebook.</text>
  <text x="74" y="139" class="body">Trace the request all the way to stored state. A label-only fix is not enough.</text>
  <path d="M64 202h582v380H64z" fill="url(#grid)"/>
  <use href="#book" transform="translate(137 272) rotate(-8 59 79)"/>
  <use href="#book" transform="translate(411 272) rotate(7 59 79)"/>
  <path d="M314 328v46m-23-23h46" stroke="#0f1419" stroke-width="3" stroke-linecap="round"/>
  <text x="196" y="497" text-anchor="middle" font-size="24" font-weight="700">Add Notebook</text>
  <text x="470" y="497" text-anchor="middle" font-size="24" font-weight="700">Add it again</text>
  <path d="M254 520h157" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="333" y="557" text-anchor="middle" class="mono">Wait for each response</text>
  <path d="M658 386h62" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="756" y="226" width="612" height="174" rx="8" fill="#fff" stroke="#d2d8df"/>
  <text x="788" y="269" font-size="25" font-weight="700">What the starter stores</text>
  <text x="788" y="337" font-size="48" font-weight="800" letter-spacing="-1.5">1 notebook</text>
  <text x="1335" y="337" text-anchor="end" font-size="40" font-weight="700">EUR 10</text>
  <path d="M788 361h548" stroke="#e2e6ea"/>
  <path d="M796 427v40m-7-8 7 8 7-8" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <text x="824" y="452" class="mono">Expected after the fix</text>
  <rect x="756" y="487" width="612" height="174" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="788" y="530" font-size="25" font-weight="700">What the customer expects</text>
  <text x="788" y="598" font-size="48" font-weight="800" letter-spacing="-1.5">2 notebooks</text>
  <text x="1335" y="598" text-anchor="end" font-size="40" font-weight="700">EUR 20</text>
  <path d="M788 622h548" stroke="#e2e6ea"/>
  <text x="104" y="646" class="body">Same product. Two completed requests.</text>
  <text x="104" y="678" class="mono">Correct quantity and total must survive reload.</text>
  <path d="M72 730h1296" stroke="#d2d8df"/>
  <text x="74" y="766" class="mono">Concept illustration / documented starter bug and expected result</text>
  <text x="1366" y="766" text-anchor="end" class="mono">Investigate with Copilot</text>
</svg>
