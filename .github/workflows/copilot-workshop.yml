name: Copilot workshop

on:
  push:
    paths:
      - "tools/copilot-workshop/**"
      - "workshops/copilot-app/**"
      - "_data/copilot_workshop.yml"
      - "_includes/copilot-workshop-nav.html"
      - "_layouts/default.html"
      - "_config.yml"
      - "css/main.css"
      - "js/main.js"
      - ".github/workflows/copilot-workshop.yml"
  pull_request:
    paths:
      - "tools/copilot-workshop/**"
      - "workshops/copilot-app/**"
      - "_data/copilot_workshop.yml"
      - "_includes/copilot-workshop-nav.html"
      - "_layouts/default.html"
      - "_config.yml"
      - "css/main.css"
      - "js/main.js"
      - ".github/workflows/copilot-workshop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Render handbook
        run: bundle exec jekyll build --destination tools/copilot-workshop/.build/site
      - name: Test release-gate rejection cases
        run: python3 -m unittest discover -s tools/copilot-workshop -p 'test_*.py'
      - name: Verify handbook, MCP receipts and live pinned references
        run: python3 tools/copilot-workshop/check-site.py --remote
